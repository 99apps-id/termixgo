# Release pipeline.
#
# Triggered by a tag like v0.2.0. The version is stamped into the binary through
# ldflags, and the checksums file is what users verify a download against.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # goreleaser reads the tag and the full history for the changelog.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The release must not ship something the gate would have rejected.
      - name: gate
        run: |
          gofmt -s -l . | tee /tmp/fmt.txt
          test ! -s /tmp/fmt.txt
          go vet ./...
          go build ./...
          go test ./...
          go test -race ./...

      - name: require Antigravity OAuth release credentials
        env:
          CLIENT_ID: ${{ secrets.TERMIXGO_ANTIGRAVITY_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.TERMIXGO_ANTIGRAVITY_CLIENT_SECRET }}
        run: |
          test -n "$CLIENT_ID"
          test -n "$CLIENT_SECRET"

      - name: goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Public installed-app credentials. The preceding gate and following
          # byte-level check make their presence mandatory for every artifact.
          TERMIXGO_ANTIGRAVITY_CLIENT_ID: ${{ secrets.TERMIXGO_ANTIGRAVITY_CLIENT_ID }}
          TERMIXGO_ANTIGRAVITY_CLIENT_SECRET: ${{ secrets.TERMIXGO_ANTIGRAVITY_CLIENT_SECRET }}

      - name: verify Antigravity OAuth stamps
        env:
          CLIENT_ID: ${{ secrets.TERMIXGO_ANTIGRAVITY_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.TERMIXGO_ANTIGRAVITY_CLIENT_SECRET }}
        run: |
          count=0
          while IFS= read -r -d '' binary; do
            grep -aFq -- "$CLIENT_ID" "$binary"
            grep -aFq -- "$CLIENT_SECRET" "$binary"
            count=$((count + 1))
          done < <(find dist -type f \( -name termixgo -o -name termixgo.exe \) -print0)
          test "$count" -eq 6
          echo "Verified OAuth stamps in $count release binaries."
