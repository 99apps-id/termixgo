# goreleaser configuration for Termixgo.
#
# The version, commit and build date are stamped through ldflags, which only
# works because internal/version declares them as vars rather than consts.
version: 2

project_name: termixgo

before:
  hooks:
    - go mod tidy
    - go vet ./...

builds:
  - id: termixgo
    main: ./cmd/termixgo
    binary: termixgo
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/99apps-id/termixgo/internal/version.Version={{ .Version }}
      - -X github.com/99apps-id/termixgo/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/99apps-id/termixgo/internal/version.BuildDate={{ .Date }}
      # The public Antigravity client pair comes from repository secrets set in
      # the release workflow, never from the tree. When the secrets are absent
      # the flag is omitted and the binary falls back to the environment or a
      # one-time prompt.
      - '{{ with .Env.TERMIXGO_ANTIGRAVITY_CLIENT_ID }}-X github.com/99apps-id/termixgo/internal/oauth.AntigravityClientID={{ . }}{{ end }}'
      - '{{ with .Env.TERMIXGO_ANTIGRAVITY_CLIENT_SECRET }}-X github.com/99apps-id/termixgo/internal/oauth.AntigravityClientSecret={{ . }}{{ end }}'
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - TERMIXGO.md
      - CHANGELOG.md
      - LICENSE
      - NOTICE
      # The install scripts travel inside the archive, so an extracted download
      # installs without cloning the repo. The Windows scripts live in
      # installer/ and ride only the Windows archive; the other branch is a glob
      # that matches no file, which goreleaser tolerates. Each lands at the
      # archive root, beside the binary it installs.
      - src: 'installer/{{ if eq .Os "windows" }}install.bat{{ else }}__platform__/*{{ end }}'
        dst: install.bat
      - src: 'installer/{{ if eq .Os "windows" }}install.ps1{{ else }}__platform__/*{{ end }}'
        dst: install.ps1
      - src: 'installer/{{ if eq .Os "windows" }}uninstall.ps1{{ else }}__platform__/*{{ end }}'
        dst: uninstall.ps1
      # install.sh rides in every archive, including the Windows one, so a
      # single zip carries the entry point for cmd, PowerShell and a Linux
      # shell beside the binary.
      - src: 'packaging/linux/install.sh'
        dst: install.sh

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  # The changelog is curated by hand in CHANGELOG.md, so the release notes
  # point at the commits rather than duplicating them badly.
  use: github-native

release:
  draft: true
  prerelease: auto

# A plain-text summary so `gh release view` and the web page stay readable.
metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"
